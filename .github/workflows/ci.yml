# Roda o lint e os testes a cada push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4   # o PySpark precisa de Java 17+
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Verificar estilo (lint)
        run: ruff check .

      - name: Rodar testes
        run: pytest -q
